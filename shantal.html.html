<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shantal Response Generator · LRM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
body{min-height:100vh;background:#0d0508;color:#ececf0;font-family:'Inter',-apple-system,sans-serif;padding:20px}
.wrap{max-width:640px;margin:0 auto}
.head{border-bottom:2px solid #b4284f;padding-bottom:16px;margin-bottom:24px;display:flex;align-items:center;gap:12px}
.crest{width:44px;height:44px;border-radius:50%;border:2px solid #b4284f;display:flex;align-items:center;justify-content:center;color:#b4284f;font-weight:800;font-size:13px}
.title{font-size:20px;font-weight:800}.title span{color:#b4284f}
.sub{font-size:11px;color:#8a8a92}
label{font-size:12px;color:#b4284f;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:6px}
textarea,input[type=text],input[type=password]{width:100%;padding:12px;border-radius:10px;background:#1a0a10;border:1px solid #3a1a25;color:#f0e0e8;font-size:14px;font-family:inherit;outline:none}
textarea:focus,input:focus{border-color:#b4284f}
textarea{resize:vertical;min-height:80px}
.scenarios{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.scenarios button{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #3a1a25;background:#1a0a10;color:#8a6a72;transition:all .15s}
.scenarios button.active{border-color:#b4284f;background:#2a0a15;color:#f0a0b8}
.gen-btn{width:100%;padding:14px;border-radius:10px;margin-top:20px;background:#b4284f;color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;letter-spacing:.06em}
.gen-btn:disabled{opacity:.4;cursor:not-allowed}
.gen-btn.loading{background:#3a1a25;cursor:wait}
.error{margin-top:12px;padding:10px;border-radius:8px;background:#2a0a0a;border:1px solid #4a1a1a;color:#ef8a8a;font-size:13px;display:none}
.results{margin-top:24px;display:none}
.results-label{font-size:12px;color:#b4284f;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
.block{background:#1a0a10;border:1px solid #3a1a25;border-radius:12px;padding:14px;margin-bottom:10px;position:relative;white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.5;color:#f0d0d8}
.cbtn{position:absolute;top:10px;right:10px;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;background:#2a1520;border:1px solid #4a2a35;color:#b4284f;cursor:pointer}
.cbtn.ok{background:#2a4a30;border-color:#5fd39a;color:#5fd39a}
.foot{margin-top:30px;padding-top:16px;border-top:1px solid #2a1520;text-align:center;font-size:10px;color:#4a3040;letter-spacing:.2em;text-transform:uppercase}
.mt{margin-top:16px}
.back{display:inline-block;margin-bottom:14px;color:#8a6a72;font-size:12px;text-decoration:none}.back:hover{color:#b4284f}
.hint{font-size:10px;color:#6f6f6f;margin-top:4px}
.key-ok{font-size:11px;color:#5fd39a;margin-top:4px;display:none}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">← Back</a>
<div class="head">
<div class="crest">LRM</div>
<div><div class="title">Shantal <span>Response Generator</span></div><div class="sub">Paste fan's message → AI generates responses in Shantal's voice</div></div>
</div>

<div id="keySection">
<label>API Key</label>
<input type="password" id="apiKey" placeholder="sk-ant-..." value="">
<div class="hint">Manager enters this once. Stays in browser memory only.</div>
<div class="key-ok" id="keyOk">✓ Key saved for this session</div>
</div>

<label class="mt">Fan's Message</label>
<textarea id="fanMsg" placeholder="Paste what the fan said here..."></textarea>

<label class="mt">Scenario</label>
<div class="scenarios" id="scenarios"></div>

<label class="mt">Extra Context (optional)</label>
<input type="text" id="context" placeholder="e.g. he just bought, he's a VIP, he's new...">

<button class="gen-btn" id="genBtn" disabled>Generate Responses</button>
<div class="error" id="error"></div>
<div class="results" id="results"><div class="results-label">Response Options</div><div id="blocks"></div></div>

<div class="foot">LIVERICHMEDIA · Shantal Response Generator · Adjust to fit the convo</div>
</div>

<script>
const SYSTEM=`You write DM responses for Shantal Monique's OnlyFans. Chatters copy-paste these into real fan conversations.

You follow the IRAE method:
I = Intrigue. Open with something that makes him curious. Never open with "thank you."
R = Relate. Mirror what he said. Make him feel heard.
A = Amplify. Build the energy. Tease, escalate, create tension.
E = Extract. Slide the offer in naturally. "Since we're already here..." energy.

REAL EXAMPLES OF HOW SHANTAL TEXTS:
Fan: "good morning beautiful" → "Mm good morning 😏 What are you getting into today?"
Fan: "just got home from work" → "Long day? I have something that might help you unwind..."
Fan: "damn you look amazing" → "You think so? Wait till you see what I filmed yesterday 😏"
Fan: "how are you" → "Better now that you're here. What took you so long? 😉"
Fan: "I bought it" → "Okay tell me which part got you first. I need to know."
Fan: "maybe later" → "Your call 😏 You know where to find me."
Fan: "that was so hot" → "That was just the beginning though... there's more if you can handle it 🥵"
Fan: "nah too expensive" → "I get it. But you haven't even seen what's in it yet 😏 Just saying."
Fan: "I've been thinking about you" → "Oh yeah? Tell me more. What exactly were you thinking about..."

WHAT SHE NEVER SOUNDS LIKE:
"I appreciate your support!" "I'm so glad you enjoyed the content!" "Would you like to see more exclusive content?" "Thank you so much for purchasing!" — DELETE these patterns. She says "I filmed something" not "I have exclusive content." "want to see?" not "would you like to view more?"

SELLING (Reading the Room playbook):
- Chatting and selling are ONE motion. Warmth is the setup. The ask is the point.
- Read the STATE not words. "I'm home alone" = steer him. "Wallet conscious" = take the wall down. "Playful" = green light, pitch now.
- YOU lead the frame. Fan feels pulled, not interviewed.
- NEVER yes/no exits. "Do you want?" invites no. Instead: "It's already in your messages. Open it before I change my mind 😏"
- Punch offer at PEAK WANT. Price objection = drop with reason or pivot smaller.
- After buy: reward → wait 15-20 min → next offer. Never stack.

CONTENT: NO BG. NO GG. NO solo play. NO dildo. Solo only. Tasteful sensuality. Spicy $200 / Extra Spicy $400 (3+ months VIP) / Extra Extra $500-700 (top spenders). No pet names. Sentence case. Emojis end only. Max 1.

OUTPUT: 2-3 options. Each = 1-3 short texts like iMessage. Label with vibe [Teasing] [Warm redirect] [Soft pitch]. Plain text. Sound like a REAL person texting.`;

const SCENARIOS=[
{id:"flirty",l:"Flirty / interested"},{id:"short",l:"Short / casual"},{id:"bought",l:"Just bought"},{id:"tipped",l:"Just tipped"},
{id:"decline",l:"Declined / not now"},{id:"quiet",l:"Opened but quiet"},{id:"compliment",l:"Compliment"},{id:"returning",l:"Returning"},
{id:"negotiating",l:"Negotiating price"},{id:"new_sub",l:"New subscriber"},{id:"home_alone",l:"Home alone / bored"},
{id:"trust",l:"Is this really you?"},{id:"fantasy",l:"Fantasy / personal Q"},{id:"tired",l:"Tired / venting"},{id:"custom",l:"Other"}];

let selScenario="flirty";
const scDiv=document.getElementById("scenarios");
SCENARIOS.forEach(s=>{const b=document.createElement("button");b.textContent=s.l;b.className=s.id===selScenario?"active":"";
b.onclick=()=>{selScenario=s.id;scDiv.querySelectorAll("button").forEach(x=>x.className="");b.className="active"};scDiv.appendChild(b)});

const apiKey=document.getElementById("apiKey"),keyOk=document.getElementById("keyOk"),fanMsg=document.getElementById("fanMsg"),
ctx=document.getElementById("context"),genBtn=document.getElementById("genBtn"),errDiv=document.getElementById("error"),
resultsDiv=document.getElementById("results"),blocks=document.getElementById("blocks");

window.onload=()=>{const k=sessionStorage.getItem("lrm_key");if(k){apiKey.value=k;keyOk.style.display="block"}checkReady()};
apiKey.addEventListener("input",()=>{const k=apiKey.value.trim();if(k.startsWith("sk-ant-")&&k.length>20){sessionStorage.setItem("lrm_key",k);keyOk.style.display="block"}else{keyOk.style.display="none"}checkReady()});
fanMsg.addEventListener("input",checkReady);
function checkReady(){genBtn.disabled=!(fanMsg.value.trim()&&sessionStorage.getItem("lrm_key"))}

genBtn.addEventListener("click",async()=>{
const key=sessionStorage.getItem("lrm_key");if(!key||!fanMsg.value.trim())return;
genBtn.disabled=true;genBtn.textContent="Generating...";genBtn.classList.add("loading");
errDiv.style.display="none";resultsDiv.style.display="none";blocks.innerHTML="";
const sl=SCENARIOS.find(s=>s.id===selScenario)?.l||"Other";
const prompt=`Fan's message: "${fanMsg.value.trim()}"
Scenario: ${sl}
${ctx.value?`Extra context: ${ctx.value}`:""}
Generate 2-3 response options Shantal can copy-paste. Plain text only.`;
try{
const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01"},
body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system:SYSTEM,messages:[{role:"user",content:prompt}]})});
const data=await res.json();
if(data.error){errDiv.textContent=data.error.message||"API error";errDiv.style.display="block";genBtn.disabled=false;genBtn.textContent="Generate Responses";genBtn.classList.remove("loading");return}
const text=data.content?.filter(b=>b.type==="text").map(b=>b.text).join("\n")||"No response";
text.split(/\n(?=Option \d|---|\d\.\s|\[)/).filter(Boolean).forEach((block,i)=>{
const d=document.createElement("div");d.className="block";d.textContent=block.trim();
const cb=document.createElement("button");cb.className="cbtn";cb.textContent="Copy";
cb.onclick=()=>{navigator.clipboard.writeText(block.trim());cb.textContent="Copied!";cb.classList.add("ok");setTimeout(()=>{cb.textContent="Copy";cb.classList.remove("ok")},2000)};
d.appendChild(cb);blocks.appendChild(d)});
resultsDiv.style.display="block";
}catch(e){errDiv.textContent="Failed to connect. Check the API key.";errDiv.style.display="block"}
genBtn.disabled=false;genBtn.textContent="Generate Responses";genBtn.classList.remove("loading")});
</script>
</body>
</html>
