var active=CATS[0].id;
var chips=document.getElementById('chips');
CATS.forEach(function(c){
  var b=document.createElement('div');b.className='chip'+(c.id===active?' on':'');
  b.textContent=c.label;b.dataset.id=c.id;
  b.onclick=function(){active=c.id;document.getElementById('fan').value='';render();syncChips();};
  chips.appendChild(b);
});
function syncChips(){[].forEach.call(chips.children,function(el){el.classList.toggle('on',el.dataset.id===active);});}
function catById(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i];return CATS[0];}
function score(text){
  text=(text||'').toLowerCase();
  if(!text.trim())return null;
  var best=null,bestN=-1;
  CATS.forEach(function(c){
    var n=0;(c.keywords||[]).forEach(function(k){if(k&&text.indexOf(k)>=0)n+=k.length;});
    if(n>bestN){bestN=n;best=c;}
  });
  return bestN>0?best:null;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
  var typed=document.getElementById('fan').value;
  var matched=score(typed);
  var cat;
  if(matched){cat=matched;active=matched.id;syncChips();}
  else{cat=catById(active);}
  var out=document.getElementById('out');out.innerHTML='';
  var cnt=document.getElementById('count');
  if(cat.locked){
    cnt.textContent='ESCALATION — do not send a sales reply';

    var card=document.createElement('div');card.className='card';

    card.appendChild(b);out.appendChild(card);
  });
}
