<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>LRM Response Generator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0a14;color:#ececf0;font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}
.wrap{max-width:660px;margin:0 auto}
.head{border-bottom:2px solid var(--accent);padding-bottom:16px;margin-bottom:18px;display:flex;align-items:center;gap:12px;transition:border-color .2s}
.crest{width:46px;height:46px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:800;font-size:13px;transition:all .2s}
.h1{font-size:21px;font-weight:800}.h1 span{color:var(--accent)}
.sub{font-size:11px;color:#8a8a92;letter-spacing:.04em;margin-top:2px}
.toggle{display:flex;gap:8px;margin-bottom:16px}
.toggle button{flex:1;padding:10px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid #2a2a40;background:#12121e;color:#8a8a98}
.toggle button.on{border-color:var(--accent);background:rgba(255,255,255,.05);color:#fff}
label{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:block;margin:14px 0 6px}
textarea,input{width:100%;padding:12px;border-radius:10px;background:#12121e;border:1px solid #2a2a40;color:#e6e6f2;font-size:14px;font-family:inherit;outline:none}
textarea{min-height:72px;resize:vertical}
textarea:focus,input:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid #2a2a40;background:#12121e;color:#8a8a98;cursor:pointer}
.chip.on{border-color:var(--accent);background:rgba(255,255,255,.05);color:#fff}
.go{width:100%;padding:14px;border-radius:10px;margin-top:18px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;letter-spacing:.05em}
.go:disabled{opacity:.4;cursor:default}
.card{background:#12121e;border:1px solid #2a2a40;border-radius:12px;padding:14px;margin-bottom:9px;position:relative;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5;color:#eee}
.copy{position:absolute;top:9px;right:9px;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600;background:rgba(255,255,255,.04);border:1px solid #3a3a50;color:var(--accent);cursor:pointer}
.copy.done{color:#5fd39a;border-color:#5fd39a}
.err{margin-top:12px;padding:10px;border-radius:8px;background:#1a0a0a;border:1px solid #4a1a1a;color:#ef8a8a;font-size:13px}
.foot{margin-top:26px;padding-top:14px;border-top:1px solid #22222e;text-align:center;font-size:10px;color:#44445a;letter-spacing:.2em;text-transform:uppercase}
.saved{font-size:11px;color:#5fd39a;margin-top:6px;display:none}
</style></head>
<body>
<div class="wrap" id="app">
  <div class="head">
    <div class="crest">LRM</div>
    <div><div class="h1"><span id="mname">Shantal</span> Response Generator</div>
    <div class="sub">paste the fan's message, get replies in her voice</div></div>
  </div>

  <div class="toggle">
    <button id="tab-shantal" class="on" onclick="setModel('shantal')">Shantal</button>
    <button id="tab-karina" onclick="setModel('karina')">Karina</button>
  </div>

  <label>Team password</label>
  <input id="pw" type="password" placeholder="enter the team password once">
  <div class="saved" id="saved">saved on this device</div>

  <label>Fan's message</label>
  <textarea id="fan" placeholder="paste what the fan said here..."></textarea>

  <label>Scenario</label>
  <div class="chips" id="chips"></div>

  <label>Extra context (optional)</label>
  <input id="ctx" placeholder="e.g. VIP spending now, non-VIP, just bought, new sub...">

  <button class="go" id="go" onclick="generate()">Generate responses</button>
  <div id="out" style="margin-top:20px"></div>

  <div class="foot">liverichmedia · response generator · adjust to fit the convo</div>
</div>

<script>
var ACCENT={shantal:"#b4284f",karina:"#7850ff"};
var BG={shantal:"#0d0508",karina:"#0a0a14"};
var SCEN=["Flirty / interested","Short / casual reply","Just bought something","Just tipped",
"Declined / not now","Opened but went quiet","Asking a question","Compliment / sweet",
"Returning after being away","Trying to negotiate price","New subscriber / first message",
"What does VIP include?","Complaint / angry / refund","Other"];
var model="shantal", scenario=SCEN[0];

function setModel(m){
  model=m;
  document.documentElement.style.setProperty('--accent',ACCENT[m]);
  document.body.style.background=BG[m];
  document.getElementById('mname').textContent=m.charAt(0).toUpperCase()+m.slice(1);
  document.getElementById('tab-shantal').classList.toggle('on',m==='shantal');
  document.getElementById('tab-karina').classList.toggle('on',m==='karina');
}
function buildChips(){
  var c=document.getElementById('chips');c.innerHTML='';
  SCEN.forEach(function(s,i){
    var b=document.createElement('div');b.className='chip'+(i===0?' on':'');b.textContent=s;
    b.onclick=function(){scenario=s;[].forEach.call(c.children,function(x){x.classList.remove('on')});b.classList.add('on');};
    c.appendChild(b);
  });
}
// Remember the password on this device so a chatter types it once.
var pw=document.getElementById('pw');
var savedPw=localStorage.getItem('lrm_pw');
if(savedPw){pw.value=savedPw;document.getElementById('saved').style.display='block';}
pw.addEventListener('change',function(){localStorage.setItem('lrm_pw',pw.value);document.getElementById('saved').style.display='block';});

async function generate(){
  var fan=document.getElementById('fan').value.trim();
  var out=document.getElementById('out');
  if(!fan){out.innerHTML='<div class="err">Paste the fan\'s message first.</div>';return;}
  if(!pw.value){out.innerHTML='<div class="err">Enter the team password.</div>';return;}
  var go=document.getElementById('go');go.disabled=true;go.textContent='generating...';
  out.innerHTML='';
  try{
    var r=await fetch('/api/generate',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:pw.value,model:model,fanMsg:fan,scenario:scenario,context:document.getElementById('ctx').value})
    });
    var data=await r.json();
    if(!r.ok){out.innerHTML='<div class="err">'+(data.error||'Error')+'</div>';}
    else{
      var blocks=(data.text||'').split(/\n(?=\[|Option \d|\d[\.\)]\s)/).filter(function(b){return b.trim();});
      if(!blocks.length)blocks=[data.text];
      blocks.forEach(function(b){
        var card=document.createElement('div');card.className='card';card.textContent=b.trim();
        var btn=document.createElement('button');btn.className='copy';btn.textContent='copy';
        btn.onclick=function(){navigator.clipboard.writeText(b.trim());btn.textContent='copied';btn.classList.add('done');setTimeout(function(){btn.textContent='copy';btn.classList.remove('done');},1500);};
        card.appendChild(btn);out.appendChild(card);
      });
    }
  }catch(e){out.innerHTML='<div class="err">Request failed. Check your connection and try again.</div>';}
  go.disabled=false;go.textContent='Generate responses';
}
setModel('shantal');buildChips();
</script>
</body></html>
